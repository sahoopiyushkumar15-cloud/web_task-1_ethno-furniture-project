<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ethno Furniture</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f3ef;
      margin: 0;
    }
  </style>
</head>

<body class="text-gray-800">

  
  <div class="bg-blue-500 text-white flex justify-between items-center px-8 h-12 text-sm">
    <div class="font-semibold tracking-wider">ETHNO</div>

    <div class="flex gap-5 uppercase tracking-wider">
      <a href="#about" class="hover:text-amber-100">About Us</a>
      <a href="#contact" class="hover:text-amber-100">Reach Us</a>
    </div>
  </div>

  
  <div class="bg-white flex items-center justify-between px-6 py-4 ">

    <div class="text-3xl font-semibold">
      Ethno
    </div>

    <div>
      <input
        type="text"
        placeholder="Search..."
        class="border border-gray-400 rounded-full px-5 py-2 w-[250px] outline-none"
      >
    </div>

    

  </div>

  
  <section class="max-w-6xl mx-auto px-6 py-10 flex flex-col md:flex-row gap-5 items-center">

   
    <div class="md:w-1/2">
      <img
        src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=900&auto=format&fit=crop"
        alt="Furniture"
        class="w-full h-[320px] object-cover rounded"
      >
    </div>

   
    <div class="md:w-1/2" id="about">

      <h1 class="text-3xl font-semibold mb-4">
        About Ethno
      </h1>

      <div class="border border-red-400 p-5 leading-7 text-gray-700 bg-white  rounded-md">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer non eleifend leo. Donec varius tempor est, eu vulputate velit viverra viverra.
      </div>

      <button class="mt-5 bg-blue-500 text-white px-5 py-2 rounded">
        Learn More
      </button>

    </div>
  </section>

  
</body>
</html>
